# Auto-deploys every push to `production` and supports manual dispatch from
# the Actions tab. Build runs on a GitHub-hosted runner and ships to
# Cloudflare Pages via wrangler-action.
#
# Required repo secrets (GitHub → Settings → Secrets and variables → Actions):
#   - CLOUDFLARE_API_TOKEN  (account-scoped, "Edit Cloudflare Workers" template)
#   - CLOUDFLARE_ACCOUNT_ID = f3ccd6adcf1b623cff15b47988b0cd24

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [production]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .svelte-kit/cloudflare --project-name=pedrolages-website --branch=production
