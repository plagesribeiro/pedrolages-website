# Cloudflare Pages configuration
# https://developers.cloudflare.com/pages/functions/wrangler-configuration/

name = "plagesribeiro-site"
compatibility_date = "2025-05-01"
pages_build_output_dir = ".svelte-kit/cloudflare"
# Account ID injected via CLOUDFLARE_ACCOUNT_ID env var or Pages dashboard.

# Leaderboard scores.
[[kv_namespaces]]
binding = "SCORES"
id = "f6afe389a75348519c92c07a8479624d"

# Drive content manifest + per-file cache (5min TTL).
[[kv_namespaces]]
binding = "CONTENT_CACHE"
id = "a04263245b7d469daeac1b9833276764"
